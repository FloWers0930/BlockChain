# ====================== Minimal Working Config for Statio Nexus ======================

# Security
requirepass StatioNexusRedis2026!
protected-mode yes
bind 0.0.0.0

# Persistence (recommended for your use case)
appendonly yes
appendfsync everysec

# Memory
maxmemory 2gb
maxmemory-policy allkeys-lru

# Basic performance
tcp-keepalive 300
timeout 0